LocalSocket /run/clamav/clamd.ctl
LocalSocketGroup www-data
LocalSocketMode 660
FixStaleSocket yes
User clamav
Foreground yes
LogFile /data/clamav-logs/clamd.log
LogTime yes
LogVerbose no
LogClean no
DatabaseDirectory /data/clamav
MaxThreads 2
MaxQueue 10
MaxFileSize 3M
MaxScanSize 12M
MaxScanTime 10000
ConcurrentDatabaseReload no
SelfCheck 600
