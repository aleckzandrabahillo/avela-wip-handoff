ServerName localhost
ServerTokens Prod
ServerSignature Off
<VirtualHost *:${PORT}>
    DocumentRoot /var/www/avela/public
    DirectoryIndex index.php
    Alias /uploads/ /data/uploads/
    <Directory /var/www/avela/public>
        Options -Indexes +FollowSymLinks
        AllowOverride FileInfo
        Require all granted
    </Directory>
    <Directory /data/uploads>
        Options -Indexes -ExecCGI
        AllowOverride None
        Require all granted
        <FilesMatch "^[a-f0-9]{32}\.(jpg|png|webp)$">
            SetHandler default-handler
        </FilesMatch>
        <FilesMatch "^(?![a-f0-9]{32}\.(jpg|png|webp)$)">
            Require all denied
        </FilesMatch>
    </Directory>
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "DENY"
    Header always set Referrer-Policy "no-referrer"
    Header always set Permissions-Policy "camera=(), microphone=(), geolocation=()"
    Header always set Content-Security-Policy "frame-ancestors 'none'; object-src 'none'; base-uri 'self'"
    LogFormat "%h %t %m %U %>s %b" avela
    CustomLog /proc/self/fd/1 avela
    ErrorLog /proc/self/fd/2
</VirtualHost>
